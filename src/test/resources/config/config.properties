# Browser Configuration
browser=chrome
headless=false

# Application URLs
base.url=https://www.saucedemo.com
staging.url=https://staging.saucedemo.com
prod.url=https://www.saucedemo.com

# Timeouts (in seconds)
implicit.wait=10
explicit.wait=20
page.load.timeout=30
script.timeout=30

# Execution Configuration
parallel.execution=false
thread.count=3
retry.failed.tests=true
max.retry.count=1

# Screenshot Configuration
take.screenshot.on.failure=true
take.screenshot.on.pass=false
screenshot.format=png

# Reporting Configuration
extent.report.title=FalconQA Test Execution Report
extent.report.name=Regression Test Suite
extent.report.theme=dark

# Logging Configuration
log.level=INFO
log.to.console=true
log.to.file=true

# Test Data Configuration
test.data.path=src/test/resources/testdata/
excel.file.name=testdata.xlsx

# Environment
environment=qa

# Grid Configuration (for future use)
grid.enabled=false
grid.hub.url=http://localhost:4444/wd/hub
